name: Reconcile full MACULA to curated LSG words (private development)

on:
  pull_request:
    paths:
      - "scripts/build_curated_lsg_word_correspondence.py"
      - "tests/test_curated_lsg_word_correspondence.py"
      - "scripts/audit_macula_lsg_contextual_lexical_pilot.py"
      - "scripts/sample_macula_lsg_semantic_review.py"
      - "scripts/audit_macula_lsg_phrase_brackets.py"
      - "scripts/audit_macula_lsg_original_syntax.py"
      - "scripts/audit_macula_lsg_diverse_syntax.py"
      - "scripts/audit_macula_lsg_syntax_lexical_neighborhood.py"
      - "tests/test_macula_lsg_syntax_lexical_neighborhood.py"
      - "links/alignments/clear-bible-lsg/syntax-lexical-neighborhood.lock.json"
      - "tests/test_macula_lsg_diverse_syntax.py"
      - "links/alignments/clear-bible-lsg/diverse-original-syntax.lock.json"
      - "tests/test_macula_lsg_original_syntax.py"
      - "scripts/audit_macula_lsg_contextual_consensus.py"
      - "tests/test_macula_lsg_contextual_consensus.py"
      - "scripts/build_macula_lsg_semantic_review_dossiers.py"
      - "scripts/validate_macula_lsg_semantic_gold.py"
      - "tests/test_macula_lsg_semantic_review_dossiers.py"
      - "tests/test_macula_lsg_semantic_gold.py"
      - "tests/test_macula_lsg_phrase_brackets.py"
      - "tests/test_macula_lsg_semantic_review_sampler.py"
      - "tests/test_macula_lsg_contextual_lexical_pilot.py"
      - "scripts/audit_curated_lsg_surface_variants.py"
      - "tests/test_curated_lsg_surface_variants.py"
      - "scripts/calibrate_aquifer_lsg_target_ids.py"
      - "tests/test_aquifer_target_id_calibration.py"
      - "links/alignments/clear-bible-lsg/**"
      - ".github/workflows/pinned-lsg-word-correspondence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-correspondence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out BRSI
        uses: actions/checkout@v4
      - name: Synthetic word correspondence and fail-closed regressions
        run: python3 -I -m unittest discover -s tests -p 'test_curated_lsg_word_correspondence.py' -v
      - name: Standalone French-source diagnostic proof regressions
        run: python3 -I -m unittest discover -s tests -p 'test_curated_lsg_surface_variants.py' -v
      - name: Blind NT semantic-lexical pilot fail-closed synthetic tests
        run: python3 -I -m unittest discover -s tests -p 'test_macula_lsg_contextual_lexical_pilot.py' -v
      - name: Stratified semantic reviewer sample fail-closed synthetic tests
        run: python3 -I -m unittest discover -s tests -p 'test_macula_lsg_semantic_review_sampler.py' -v
      - name: Phrase-bracket localization and lexical abstention regressions
        run: python3 -I -m unittest discover -s tests -p 'test_macula_lsg_phrase_brackets.py' -v
      - name: Review dossier exact-source and blind partition synthetic regressions
        run: python3 -I -m unittest discover -s tests -p 'test_macula_lsg_semantic_review_dossiers.py' -v
      - name: Human-only phrase/grammar gold adjudication synthetic regressions
        run: python3 -I -m unittest discover -s tests -p 'test_macula_lsg_semantic_gold.py' -v
      - name: Lexical and bracket consensus synthetic gold and no-promotion regressions
        run: python3 -I -m unittest discover -s tests -p 'test_macula_lsg_contextual_consensus.py' -v
      - name: Original Hebrew/Greek lowfat syntax and morpheme safety synthetic regressions
        run: python3 -I -m unittest discover -s tests -p 'test_macula_lsg_original_syntax.py' -v
      - name: Mixed genre MACULA original syntax review-unit regressions
        run: python3 -I -m unittest discover -s tests -p 'test_macula_lsg_diverse_syntax.py' -v
      - name: Real source grammar by French lexical-neighborhood masked-pseudogold tests
        run: python3 -I -m unittest discover -s tests -p 'test_macula_lsg_syntax_lexical_neighborhood.py' -v
      - name: Retrieve exact original Clear.Bible alignment sources
        shell: bash
        run: |
          set -euo pipefail
          revision=c99bd0ae6946775f932517656308ca19fc706921
          git init /tmp/brsi-word-clear
          git -C /tmp/brsi-word-clear remote add origin https://github.com/Clear-Bible/Alignments.git
          git -C /tmp/brsi-word-clear sparse-checkout init --cone
          git -C /tmp/brsi-word-clear sparse-checkout set data/sources data/fra/alignments/LSG data/fra/targets/LSG
          git -C /tmp/brsi-word-clear -c protocol.version=2 fetch --depth 1 --filter=blob:none origin "$revision"
          git -C /tmp/brsi-word-clear checkout --detach FETCH_HEAD
          test "$(git -C /tmp/brsi-word-clear rev-parse HEAD)" = "$revision"
      - name: Rebuild all original source groups with exact file checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/build_translation_alignments.py \
            --manifest links/alignments/clear-bible-lsg/manifest.json \
            --corrections links/alignments/clear-bible-lsg/corrections.json \
            --upstream-root /tmp/brsi-word-clear \
            --output-dir /tmp/brsi-word-original
          python3 -I scripts/verify_generated_json.py \
            --generated /tmp/brsi-word-original/receipt.json \
            --baseline links/alignments/clear-bible-lsg/receipt.lock.json
      - name: Retrieve exact published Bible Resources LSG 1.0.2 OSIS
        shell: bash
        run: |
          set -euo pipefail
          revision=7092d6e9318eeff46081feb831c207efa5859af2
          git init /tmp/brsi-word-reader
          git -C /tmp/brsi-word-reader remote add origin https://github.com/icfmp/Bible-Resources.git
          git -C /tmp/brsi-word-reader sparse-checkout init --cone
          git -C /tmp/brsi-word-reader sparse-checkout set sources/cleaned/bibles/fr/lsg-1910 modules/lsg-1910
          git -C /tmp/brsi-word-reader -c protocol.version=2 fetch --depth 1 --filter=blob:none origin "$revision"
          git -C /tmp/brsi-word-reader checkout --detach FETCH_HEAD
          test "$(git -C /tmp/brsi-word-reader rev-parse HEAD)" = "$revision"
      - name: Retrieve Aquifer French word-surfaced alignment evidence at pinned revision
        shell: bash
        run: |
          set -euo pipefail
          revision=c25cc382fb3584a0837289f1499a7f56a4798dde
          git init /tmp/brsi-word-aquifer
          git -C /tmp/brsi-word-aquifer remote add origin https://github.com/BibleAquifer/LouisSegond1910.git
          git -C /tmp/brsi-word-aquifer sparse-checkout init --cone
          git -C /tmp/brsi-word-aquifer sparse-checkout set fra/alignments/json
          git -C /tmp/brsi-word-aquifer -c protocol.version=2 fetch --depth 1 --filter=blob:none origin "$revision"
          git -C /tmp/brsi-word-aquifer checkout --detach FETCH_HEAD
          test "$(git -C /tmp/brsi-word-aquifer rev-parse HEAD)" = "$revision"
          test "$(find /tmp/brsi-word-aquifer/fra/alignments/json -name '*.alignment.json' | wc -l)" -ge 1180
      - name: Regenerate independently text-attested Clear.Bible NT word index
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/audit_curated_translation_edition.py \
            --alignment-manifest links/alignments/clear-bible-lsg/manifest.json \
            --curated-lock links/alignments/clear-bible-lsg/curated-1.0.2.lock.json \
            --upstream-root /tmp/brsi-word-clear \
            --curated-root /tmp/brsi-word-reader \
            --candidate-dir /tmp/brsi-word-original \
            --output /tmp/brsi-word-nt-original-report.json \
            --index-output /tmp/brsi-word-nt-original-index.json.gz
          python3 -I - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('links/alignments/clear-bible-lsg/curated-1.0.2-parity.lock.json').read_text())
          actual = json.loads(Path('/tmp/brsi-word-nt-original-report.json').read_text())
          assert actual['private_nt_word_index'] == baseline['private_nt_word_index']
          assert actual['nt'] == baseline['nt']
          assert actual['curated_osis_sha256'] == baseline['curated_osis_sha256']
          assert actual['clear_bible_revision'] == baseline['clear_bible_revision']
          print('FULL_ORIGINAL_NT_FRENCH_WORD_INDEX_SHA_VERIFIED',
                actual['private_nt_word_index']['gzip_sha256'])
          PY
      - name: Generate BRSI-owned original+independent MACULA French word candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/build_curated_lsg_word_correspondence.py \
            --aquifer-root /tmp/brsi-word-aquifer \
            --candidates /tmp/brsi-word-original \
            --curated-root /tmp/brsi-word-reader \
            --curated-lock links/alignments/clear-bible-lsg/curated-1.0.2.lock.json \
            --clear-revision c99bd0ae6946775f932517656308ca19fc706921 \
            --aquifer-revision c25cc382fb3584a0837289f1499a7f56a4798dde \
            --min-chapters 1180 \
            --gold-nt-index /tmp/brsi-word-nt-original-index.json.gz \
            --clear-root /tmp/brsi-word-clear \
            --source-manifest links/alignments/clear-bible-lsg/manifest.json \
            --output /tmp/brsi-macula-lsg-correspondence.json.gz \
            --report /tmp/brsi-macula-lsg-correspondence-receipt.json
      - name: Independently verify full index gzip digests and source coverage
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          r = json.loads(Path('/tmp/brsi-macula-lsg-correspondence-receipt.json').read_text())
          compressed = Path('/tmp/brsi-macula-lsg-correspondence.json.gz').read_bytes()
          assert hashlib.sha256(compressed).hexdigest() == r['gzip_sha256']
          assert len(compressed) == r['gzip_bytes']
          raw = gzip.decompress(compressed)
          assert hashlib.sha256(raw).hexdigest() == r['uncompressed_sha256']
          assert len(raw) == r['uncompressed_bytes']
          doc = json.loads(raw)
          assert doc['original_group_counts'] == {'nt': 104807, 'ot': 203597}
          assert doc['publication_approved'] is False
          assert doc['automatic_linguistic_approval'] is False
          supp = doc['supplemental_macula_source_counts']
          added = supp.get('nt_added_source_words', 0) + supp.get('ot_added_source_words', 0)
          unmapped = supp.get('nt_source_tokens_without_word_evidence', 0) + supp.get('ot_source_tokens_without_word_evidence', 0)
          assert len(doc['rows']) == 308404 + added + unmapped
          assert supp['original_source_macula_ids'] == 607217
          assert len(doc['by_original_macula_id']) == 607217
          assert all(doc['by_original_macula_id'].values())
          coverage = doc['source_coverage']
          assert coverage == r['source_coverage']
          assert coverage['nt']['macula_source_ids'] == 137741
          assert coverage['ot']['macula_source_ids'] == 469476
          assert all(x['macula_source_ids_with_word_evidence'] +
                     x['macula_source_ids_without_word_evidence'] == x['macula_source_ids']
                     for x in coverage.values())
          assert coverage['nt']['macula_source_ids_with_word_evidence'] > 100000
          assert coverage['ot']['macula_source_ids_with_word_evidence'] > 350000
          # Every unlinked original MACULA source ID gets exactly one
          # source-evidenced explanation, not a guessed French word.
          reasons = doc['unlinked_cause_by_original_macula_id']
          cause_counts = doc['unlinked_source_cause_counts']
          assert cause_counts == r['unlinked_source_cause_counts']
          assert doc['unlinked_source_diagnostics'] == r['unlinked_source_diagnostics']
          assert len(reasons) == sum(
              coverage[canon]['macula_source_ids_without_word_evidence']
              for canon in ('nt', 'ot'))
          assert len(reasons) <= 119723  # no regression against reviewed PR #177
          assert all(source in doc['by_original_macula_id'] and not any(
              doc['rows'][i]['word_ids'] for i in doc['by_original_macula_id'][source]
          ) for source in reasons)
          assert all(sum(cause_counts[canon].values()) ==
                     coverage[canon]['macula_source_ids_without_word_evidence']
                     for canon in ('nt', 'ot'))
          # Partition every original MACULA source row with an Aquifer
          # target that cannot be safely located in authored LSG.
          failed_target_causes = doc['unlocated_french_target_cause_by_original_macula_id']
          failed_target_counts = doc['unlocated_french_target_cause_counts']
          assert failed_target_counts == r['unlocated_french_target_cause_counts']
          assert len(failed_target_causes) == sum(
              cause_counts[c].get(
                  'aquifer_record_source_with_no_uniquely_located_french_word', 0)
              for c in ('nt', 'ot'))
          assert all(
              source in reasons and
              reasons[source] == 'aquifer_record_source_with_no_uniquely_located_french_word'
              and all(not doc['rows'][i]['word_ids']
                      for i in doc['by_original_macula_id'][source])
              for source in failed_target_causes)
          assert all(
              sum(failed_target_counts[c].values()) ==
              cause_counts[c].get(
                  'aquifer_record_source_with_no_uniquely_located_french_word', 0)
              for c in ('nt', 'ot'))
          print('BRSI_UNLOCATED_FRENCH_TARGET_CAUSES', failed_target_counts)
          assert all(row['linguistically_reviewed_by_brsi'] is False
                     for row in doc['rows'])
          assert doc['unlinked_cause_evidence_level'] == 'source_metadata_or_structure_not_word_equivalence'
          print('BRSI_MACULA_UNLINKED_SOURCE_CAUSES', cause_counts)
          assert len(doc['by_original_macula_id']) > 200000
          assert doc['aquifer_text_witness_census']['chapters'] >= 1180
          assert all(row['linguistically_reviewed_by_brsi'] is False for row in doc['rows'])
          # Independent exact authorial word-span proof for all retained
          # Aquifer candidate word links, including any unordered fallback.
          import importlib.util
          import unicodedata
          from collections import Counter
          spec = importlib.util.spec_from_file_location(
              'curated_index', 'scripts/audit_curated_translation_edition.py')
          ed = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ed)
          lock = json.loads(Path('links/alignments/clear-bible-lsg/curated-1.0.2.lock.json').read_text())
          osis = ed.pinned_file(Path('/tmp/brsi-word-reader'),
                               lock['osis_path'], lock['osis_sha256'])
          authored = ed.read_osis(osis)
          word_cache = {}
          evidence_counts = Counter()
          for row in doc['rows']:
              proofs = row.get('aquifer_source_word_location_proofs', [])
              assert {p['word_id'] for p in proofs} == set(
                  row['aquifer_source_word_witness_ids'])
              for proof in proofs:
                  bcv, word_ordinal = proof['word_id'].split(':')
                  ordinal = int(word_ordinal)
                  if bcv not in word_cache:
                      text = unicodedata.normalize('NFC', authored[bcv])
                      word_cache[bcv] = [m.group() for m in
                                         ed.AUTHORIAL_WORD_RE.finditer(text)]
                  words = word_cache[bcv]
                  assert 1 <= ordinal <= len(words)
                  actual_word = words[ordinal - 1]
                  assert hashlib.sha256(actual_word.encode('utf-8')).hexdigest() == proof['word_sha256']
                  assert proof['aquifer_target_id'][:8] == bcv
                  assert proof['location_proof'] in (
                      'forced_ordered_exact_word',
                      'unique_exact_surface_without_order_proof',
                      'unique_exact_contiguous_original_target_trigram',
                      'unique_exact_adjacent_anchored_pair')
                  evidence_counts[proof['location_proof']] += 1
          assert evidence_counts['forced_ordered_exact_word'] > 300000
          assert r['aquifer_text_witness_census'].get(
              'ot_target_words_unique_exact_surface_without_order_proof', 0
          ) + r['aquifer_text_witness_census'].get(
              'nt_target_words_unique_exact_surface_without_order_proof', 0
          ) > 0
          # Independently verify each *new* repeated-word location using
          # the unchanged complete Aquifer French target-verse token list,
          # three consecutive original full-word selector IDs, the
          # independently parsed LSG authorial word sequence and an
          # exactly once-occurring contiguous 3-word phrase on EACH side.
          from collections import defaultdict
          new_trigrams = {}
          for row in doc['rows']:
              for proof in row.get('aquifer_source_word_location_proofs', []):
                  if proof['location_proof'] != (
                      'unique_exact_contiguous_original_target_trigram'):
                      continue
                  key = proof['aquifer_target_id']
                  witness = proof['word_id']
                  if key in new_trigrams:
                      assert new_trigrams[key] == witness
                  new_trigrams[key] = witness
          assert new_trigrams, "source corpus has no new repeat-word trigrams"
          new_pairs = {}
          for row in doc['rows']:
              for proof in row.get('aquifer_source_word_location_proofs', []):
                  if proof['location_proof'] != 'unique_exact_adjacent_anchored_pair':
                      continue
                  key = proof['aquifer_target_id']
                  witness = proof['word_id']
                  if key in new_pairs:
                      assert new_pairs[key] == witness
                  new_pairs[key] = witness
          assert new_pairs, "no source-attested adjacent-anchor repeated word"
          target_verses = {selector[:8] for selector in new_trigrams}
          target_verses.update(selector[:8] for selector in new_pairs)
          target_items = defaultdict(dict)
          for path in sorted(Path(
                  '/tmp/brsi-word-aquifer/fra/alignments/json').glob('*.alignment.json')):
              chapter = json.loads(path.read_text(encoding='utf-8'))
              for group in chapter['groups']:
                  if group.get('type') != 'translation':
                      continue
                  strings = [
                      value for record in group['records']
                      for value in record.get('target', [])
                  ] + group.get('meta', {}).get('nonEquivalent', {}).get('target', [])
                  for value in strings:
                      selector, delimiter, word = value.partition('|')
                      if selector[:8] not in target_verses:
                          continue
                      # Original Aquifer nonEquivalent.target can contain
                      # empty-surface selectors. The pinned producer excludes
                      # exactly these; they cannot be word context anchors.
                      if not delimiter or not word.strip():
                          continue
                      word = unicodedata.normalize('NFC', word)
                      old = target_items[selector[:8]].setdefault(selector, word)
                      assert old == word
          verified = set()
          for selector, witness in sorted(new_trigrams.items()):
              bcv, ordinal = witness.split(':')
              ordinal = int(ordinal)
              source = sorted(
                  target_items[bcv].items(),
                  key=lambda pair: (int(pair[0][8:11]),
                                    int(pair[0][11:] or '0')))
              source_ids = [item[0] for item in source]
              source_surfaces = [item[1] for item in source]
              i = source_ids.index(selector)
              authored_words = word_cache[bcv]
              j = ordinal - 1
              assert source_surfaces[i] == authored_words[j]
              candidates = []
              for k in (i - 2, i - 1, i):
                  if k < 0 or k + 3 > len(source):
                      continue
                  selectors = source_ids[k:k + 3]
                  if (not all(len(s) == 11 and s[:8] == bcv for s in selectors)
                      or [int(s[8:]) for s in selectors] !=
                          list(range(int(selectors[0][8:]),
                                     int(selectors[0][8:]) + 3))):
                      continue
                  phrase = source_surfaces[k:k + 3]
                  author_start = j - (i - k)
                  if author_start < 0 or author_start + 3 > len(authored_words):
                      continue
                  if authored_words[author_start:author_start + 3] != phrase:
                      continue
                  original_copies = sum(
                      source_surfaces[x:x + 3] == phrase
                      for x in range(len(source_surfaces) - 2))
                  authored_copies = sum(
                      authored_words[x:x + 3] == phrase
                      for x in range(len(authored_words) - 2))
                  if original_copies == authored_copies == 1:
                      candidates.append(k)
              assert candidates, (
                  'unverified original+curated repeated-word contiguous trigram',
                  selector, witness)
              verified.add(selector)
          assert verified == set(new_trigrams)
          # Independent whole-word adjacency proof: each newly located
          # original French target has at least one *consecutive* original
          # target word serving as an exact unique authored/source anchor.
          # For every such original neighbor verify the proposed target;
          # competing compatible anchors must NOT disagree on a position.
          anchored_verified = set()
          for selector, witness in sorted(new_pairs.items()):
              bcv, ordinal = witness.split(':')
              j = int(ordinal) - 1
              source = sorted(
                  target_items[bcv].items(),
                  key=lambda pair: (int(pair[0][8:11]),
                                    int(pair[0][11:] or '0')))
              source_ids = [entry[0] for entry in source]
              source_surfaces = [entry[1] for entry in source]
              i = source_ids.index(selector)
              authored_words = word_cache[bcv]
              assert source_surfaces[i] == authored_words[j]
              assert len(selector) == 11
              candidates = set()
              for k in (i - 1, i + 1):
                  if not 0 <= k < len(source):
                      continue
                  source_anchor_id, anchor_word = source[k]
                  if (len(source_anchor_id) != 11
                      or source_anchor_id[:8] != bcv
                      or int(source_anchor_id[8:]) -
                         int(selector[8:]) != k - i):
                      continue
                  if (source_surfaces.count(anchor_word) != 1 or
                      authored_words.count(anchor_word) != 1):
                      continue
                  anchor_j = authored_words.index(anchor_word)
                  candidate = anchor_j + i - k
                  if (0 <= candidate < len(authored_words) and
                      authored_words[candidate] == source_surfaces[i]):
                      candidates.add(candidate)
              assert candidates == {j}, (
                  'source or authored exact unique anchor is not compelling',
                  selector, witness, candidates)
              anchored_verified.add(selector)
          assert anchored_verified == set(new_pairs)
          print('BRSI_INDEPENDENT_ORIGINAL_REPEATED_WORD_ANCHORS',
                len(anchored_verified))
          print('BRSI_INDEPENDENT_ORIGINAL_REPEATED_WORD_TRIGRAMS', len(verified))
          print('BRSI_FULL_AUTHORIAL_WORD_WITNESSES', dict(sorted(evidence_counts.items())))
          assert all(row['source_provenance'] for row in doc['rows'])
          assert doc['source_license_aquifer_alignment'] == 'CC BY-SA 4.0'
          assert sum(doc['status_counts'].values()) == 308404 + added + unmapped
          print('BRSI_MACULA_LSG_SOURCE_PRESERVATION_OK', r['status_counts'])
          PY
      - name: Calibrate auxiliary target IDs against source-text-attested NT word positions
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/calibrate_aquifer_lsg_target_ids.py \
            --gold-nt-index /tmp/brsi-word-nt-original-index.json.gz \
            --auxiliary-index /tmp/brsi-macula-lsg-correspondence.json.gz \
            --report /tmp/brsi-aquifer-target-id-calibration.json
          python3 -I - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/brsi-aquifer-target-id-calibration.json').read_text())
          c = report['counts']
          assert c['original_nt_exact_french_word_candidates'] == 91649
          assert c['original_nt_word_mapping_unresolved'] == 13158
          assert c['aquifer_same_original_target_id_exact_word'] + c.get('aquifer_same_original_target_id_wrong_word', 0) + c.get('aquifer_original_target_id_not_located', 0) == 91649
          assert report['target_id_equivalence_assumed'] is False
          print('BRSI_NT_ORIGINAL_TARGET_ID_CROSSVALIDATION', c)
          PY
      - name: Check published private development evidence receipt when frozen
        run: |
          set -euo pipefail
          if test -f links/alignments/clear-bible-lsg/aquifer-correspondence.lock.json; then
            python3 -I scripts/verify_generated_json.py \
              --generated /tmp/brsi-macula-lsg-correspondence-receipt.json \
              --baseline links/alignments/clear-bible-lsg/aquifer-correspondence.lock.json
          else
            echo "INITIAL SOURCE AUDIT: exact receipt must be independently frozen before merge"
          fi
      - name: Audit all original unlinked MACULA French exact-word gaps from pinned current index
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/audit_curated_lsg_surface_variants.py \
