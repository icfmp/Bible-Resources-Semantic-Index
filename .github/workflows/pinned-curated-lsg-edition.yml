name: Build BRSI-owned LSG word index from pinned Clear.Bible (no publication)

on:
  pull_request:
    paths:
      - ".github/workflows/pinned-curated-lsg-edition.yml"
      - "links/alignments/clear-bible-lsg/**"
      - "scripts/build_translation_alignments.py"
      - "scripts/audit_curated_translation_edition.py"
      - "tests/test_curated_translation_edition.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-curated-lsg-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out BRSI
        uses: actions/checkout@v4
      - name: Run source-independent curated edition diagnostic regressions
        run: python3 -I -m unittest discover -s tests -p 'test_curated_translation_edition.py' -v
      - name: Retrieve pinned Clear.Bible alignment inputs
        shell: bash
        run: |
          set -euo pipefail
          revision=c99bd0ae6946775f932517656308ca19fc706921
          mkdir -p /tmp/brsi-curated-upstream
          git -C /tmp/brsi-curated-upstream init
          git -C /tmp/brsi-curated-upstream remote add origin https://github.com/Clear-Bible/Alignments.git
          git -C /tmp/brsi-curated-upstream sparse-checkout init --cone
          git -C /tmp/brsi-curated-upstream sparse-checkout set data/sources data/fra/alignments/LSG data/fra/targets/LSG
          git -C /tmp/brsi-curated-upstream -c protocol.version=2 fetch --depth 1 --filter=blob:none origin "$revision"
          git -C /tmp/brsi-curated-upstream checkout --detach FETCH_HEAD
          test "$(git -C /tmp/brsi-curated-upstream rev-parse HEAD)" = "$revision"
      - name: Retrieve immutable Bible Resources 1.0.2 cleaned OSIS and module metadata
        shell: bash
        run: |
          set -euo pipefail
          revision=7092d6e9318eeff46081feb831c207efa5859af2
          mkdir -p /tmp/brsi-curated-reader
          git -C /tmp/brsi-curated-reader init
          git -C /tmp/brsi-curated-reader remote add origin https://github.com/icfmp/Bible-Resources.git
          git -C /tmp/brsi-curated-reader sparse-checkout init --cone
          git -C /tmp/brsi-curated-reader sparse-checkout set sources/cleaned/bibles/fr/lsg-1910 modules/lsg-1910
          git -C /tmp/brsi-curated-reader -c protocol.version=2 fetch --depth 1 --filter=blob:none origin "$revision"
          git -C /tmp/brsi-curated-reader checkout --detach FETCH_HEAD
          test "$(git -C /tmp/brsi-curated-reader rev-parse HEAD)" = "$revision"
      - name: Recreate exact private alignment candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/build_translation_alignments.py \
            --manifest links/alignments/clear-bible-lsg/manifest.json \
            --corrections links/alignments/clear-bible-lsg/corrections.json \
            --upstream-root /tmp/brsi-curated-upstream \
            --output-dir /tmp/brsi-curated-candidate
          python3 -I scripts/verify_generated_json.py \
            --generated /tmp/brsi-curated-candidate/receipt.json \
            --baseline links/alignments/clear-bible-lsg/receipt.lock.json
      - name: Compare every curated OSIS verse to original French target TSV and OT references
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/audit_curated_translation_edition.py \
            --alignment-manifest links/alignments/clear-bible-lsg/manifest.json \
            --curated-lock links/alignments/clear-bible-lsg/curated-1.0.2.lock.json \
            --upstream-root /tmp/brsi-curated-upstream \
            --curated-root /tmp/brsi-curated-reader \
            --candidate-dir /tmp/brsi-curated-candidate \
            --output /tmp/brsi-curated-edition-report.json \
            --index-output /tmp/brsi-curated-lsg-nt-index.json.gz \
            --ot-index-output /tmp/brsi-curated-lsg-ot-verse-index.json.gz \
            --word-inventory-output /tmp/brsi-curated-lsg-authorial-words.json.gz
      - name: Verify BRSI-owned, source-preserving bidirectional index
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import gzip
          import hashlib
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/brsi-curated-edition-report.json').read_text())
          receipt = report['private_nt_word_index']
          file = Path('/tmp/brsi-curated-lsg-nt-index.json.gz')
          compressed = file.read_bytes()
          assert hashlib.sha256(compressed).hexdigest() == receipt['gzip_sha256']
          assert len(compressed) == receipt['gzip_bytes']
          raw = gzip.decompress(compressed)
          assert hashlib.sha256(raw).hexdigest() == receipt['uncompressed_sha256']
          assert len(raw) == receipt['uncompressed_bytes']
          result = json.loads(raw)
          assert result['status'] == 'private_nonpublishing_unapproved'
          assert result['format'] == 'brsi-curated-translation-word-index-candidate'
          assert result['index_owner'] == 'Bible Resources Semantic Index'
          assert len(result['by_original_macula_id']) >= 90000
          assert len(result['by_curated_word']) >= 50000
          assert sum(len(v) for v in result['by_curated_word'].values()) == result['coverage']['surface_word_position_candidate']
          assert all(isinstance(v, list) and v for v in result['by_original_macula_id'].values())
          assert result['original_alignment_records'] == 104807
          assert result['coverage'] == receipt['coverage']
          assert result['coverage']['surface_word_position_candidate'] > 1000
          assert result['coverage']['unresolved'] > 0
          assert all(row['editorially_approved'] is False for row in result['rows'])
          print('BRSI_OWNED_INDEX_CANDIDATE', result['coverage'])
          # OT has genuine original verse selectors but NO French word-token
          # inventory: source IDs and verse-level inverse lookup only.
          ot_receipt = report['private_ot_verse_index']
          ot_file = Path('/tmp/brsi-curated-lsg-ot-verse-index.json.gz')
          ot_compressed = ot_file.read_bytes()
          assert hashlib.sha256(ot_compressed).hexdigest() == ot_receipt['gzip_sha256']
          assert len(ot_compressed) == ot_receipt['gzip_bytes']
          ot_raw = gzip.decompress(ot_compressed)
          assert hashlib.sha256(ot_raw).hexdigest() == ot_receipt['uncompressed_sha256']
          assert len(ot_raw) == ot_receipt['uncompressed_bytes']
          ot = json.loads(ot_raw)
          assert ot['format'] == 'brsi-curated-translation-verse-index-candidate'
          assert ot['index_owner'] == 'Bible Resources Semantic Index'
          assert ot['canon'] == 'ot'
          assert ot['original_alignment_records'] == 203597
          assert ot['coverage'] == ot_receipt['coverage']
          assert ot['coverage']['verse_reference_present_word_unverified'] == 203597
          assert ot['coverage']['different_original_source_target_verse_coordinates'] == 920
          assert len(ot['by_original_macula_id']) >= 100000
          assert len(ot['by_curated_verse']) > 10000
          assert all(row['curated_word_position'] is None and
                     row['target_word_inventory_verified'] is False and
                     row['editorially_approved'] is False for row in ot['rows'])
          assert all(all(verse in ot['by_curated_verse'] for verse in row['curated_target_verses'])
                     for row in ot['rows'])
          print('BRSI_OWNED_OT_VERSE_INDEX', ot['coverage'])
          PY
      - name: Check every NT Clear.Bible target surface against its exact authored French word
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import gzip
          import hashlib
          import importlib.util
          import json
          import unicodedata
          from collections import Counter
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('edition', 'scripts/audit_curated_translation_edition.py')
          ed = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ed)
          root = Path('links/alignments/clear-bible-lsg')
          manifest = json.loads((root / 'manifest.json').read_text())
          lock = json.loads((root / 'curated-1.0.2.lock.json').read_text())
          upstream_files = {p['key']: p for p in manifest['inputs']}
          key = next(x['target'] for x in manifest['groups'] if x['canon'] == 'nt')
          input_spec = upstream_files[key]
          tsv = ed.pinned_file(Path('/tmp/brsi-curated-upstream'), input_spec['path'], input_spec['sha256'])
          words, _ = ed.read_target_tsv(tsv)
          target = {identifier: surface for group in words.values() for identifier, surface in group}
          authored_file = ed.pinned_file(Path('/tmp/brsi-curated-reader'), lock['osis_path'], lock['osis_sha256'])
          authored = ed.read_osis(authored_file)
          index = json.loads(gzip.decompress(Path('/tmp/brsi-curated-lsg-nt-index.json.gz').read_bytes()))
          validated = 0
          reasons = Counter()
          for record in index['rows']:
              assertion = record['authored_word_surface_attestation']
              if record['status'] == 'unresolved':
                  assert assertion is None
                  continue
              assert assertion is not None
              assert record['editorially_approved'] is False
              assert len(record['original_target_ids']) == 1
              token = record['original_target_ids'][0]
              assert token in target
              assert record['curated_bcv'] == token[:8]
              source = unicodedata.normalize('NFC', authored[record['curated_bcv']])
              begin = assertion['nfc_start_codepoint']
              end = assertion['nfc_end_codepoint']
              assert 0 <= begin < end <= len(source)
              word = source[begin:end]
              assert hashlib.sha256(word.encode('utf-8')).hexdigest() == assertion['nfc_word_sha256']
              original = unicodedata.normalize('NFC', target[token])
              assert hashlib.sha256(original.encode('utf-8')).hexdigest() == assertion['original_target_nfc_sha256']
              assert ed.classify_exact_word_surface(original, word) == assertion['word_surface_evidence']
              assert assertion['word_ordinal'] == record['curated_diagnostic_word_ordinal']
              assert assertion['source_surface_compatible_with_authored_word']
              validated += 1
              reasons[assertion['word_surface_evidence']] += 1
          assert validated == index['coverage']['surface_word_position_candidate'] == 91649
          assert sum(reasons.values()) == validated
          for name, count in reasons.items():
              assert index['coverage']['word_surface_evidence_' + name] == count
          assert not any(row['editorially_approved'] for row in index['rows'])
          print('BRSI_NT_EXACT_AUTHORIAL_WORD_EVIDENCE', dict(sorted(reasons.items())))
          PY
      - name: Verify complete independently indexed French words against pinned authored OSIS
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import gzip
          import hashlib
          import importlib.util
          import json
          import unicodedata
          from pathlib import Path
          report = json.loads(Path('/tmp/brsi-curated-edition-report.json').read_text())
          receipt = report['private_authorial_word_inventory']
          path = Path('/tmp/brsi-curated-lsg-authorial-words.json.gz')
          compressed = path.read_bytes()
          assert hashlib.sha256(compressed).hexdigest() == receipt['gzip_sha256']
          assert len(compressed) == receipt['gzip_bytes']
          raw = gzip.decompress(compressed)
          assert hashlib.sha256(raw).hexdigest() == receipt['uncompressed_sha256']
          assert len(raw) == receipt['uncompressed_bytes']
          index = json.loads(raw)
          assert index['source_text_embedded'] is False
          assert index['status'] == 'private_nonpublishing_unapproved'
          assert index['format'] == 'brsi-curated-authorial-word-inventory'
          assert index['curated_osis_sha256'] == report['curated_osis_sha256']
          assert index['coverage'] == receipt['coverage']
          assert index['coverage']['verses'] == 31170
          assert index['coverage']['ot']['words'] > 100000
          assert index['coverage']['nt']['words'] > 50000
          spec = importlib.util.spec_from_file_location('edition', 'scripts/audit_curated_translation_edition.py')
          ed = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ed)
          lock = json.loads(Path('links/alignments/clear-bible-lsg/curated-1.0.2.lock.json').read_text())
          authored = ed.read_osis(ed.pinned_file(Path('/tmp/brsi-curated-reader'), lock['osis_path'], lock['osis_sha256']))
          assert set(authored) == set(index['by_verse'])
          verified = 0
          for bcv, record in index['by_verse'].items():
              text = unicodedata.normalize('NFC', authored[bcv])
              assert hashlib.sha256(text.encode('utf-8')).hexdigest() == record['nfc_verse_sha256']
              assert len(text) == record['nfc_codepoints']
              previous_end = 0
              for ordinal, word in enumerate(record['words'], 1):
                  assert word['ordinal'] == ordinal
                  start, end = word['nfc_start_codepoint'], word['nfc_end_codepoint']
                  assert 0 <= previous_end <= start < end <= len(text)
                  assert hashlib.sha256(text[start:end].encode('utf-8')).hexdigest() == word['nfc_word_sha256']
                  assert 'surface' not in word
                  previous_end = end
                  verified += 1
          assert verified == index['coverage']['words']
          assert index['coverage']['ot']['verses'] + index['coverage']['nt']['verses'] == 31170
          print('BRSI_AUTHORED_WORD_INVENTORY', index['coverage'])
          PY
      - name: Verify full pinned curated-edition diagnostic JSON receipt
        run: |
          set -euo pipefail
          python3 -I scripts/verify_generated_json.py \
            --generated /tmp/brsi-curated-edition-report.json \
            --baseline links/alignments/clear-bible-lsg/curated-1.0.2-parity.lock.json
      - name: Explicit source and publication boundaries
        run: |
          echo "Read-only edition candidate comparison. No source text committed or uploaded."
          echo "No French token remaps, cross-versification guesses, release or app changes."
