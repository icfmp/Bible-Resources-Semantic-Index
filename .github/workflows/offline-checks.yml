name: BRSI standalone offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for exact PR-base new-tool comparison
      - name: Verify maintained workflow Python paths
        run: python3 -I scripts/tool_registry.py --check-workflows --review-candidates
      - name: Read-only repository hygiene (tracked files, docs and new tools)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -I scripts/check_repository_hygiene.py --base-sha "$PR_BASE_SHA"
      - name: Entity and workspace regressions
        run: |
          python3 -I -m unittest discover -s tests -p 'test_*.py'
      - name: Audit current identity metadata (index-only guards run in tests)
        run: |
          python3 -I scripts/audit_identity_surface.py
          python3 -I scripts/audit_name_ambiguities.py --sample-limit 8
          python3 -I scripts/audit_family_relation_consistency.py --limit 12
      - name: UBS source-baseline regressions
        run: |
          python3 -I links/dictionaries/ubs-greek/test_index.py
          python3 -I links/dictionaries/ubs-hebrew/test_index.py

# Full external source-pinned Greek/Hebrew checks run in their dedicated
# workflows; do not upload restricted evidence or publish releases here.
