name: BSI standalone offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Entity and workspace regressions
        run: |
          python3 -I -m unittest discover -s tests -p 'test_*.py'
      - name: Enforce index-only BRSI records and inspect identity metadata
        run: |
          python3 -I scripts/prune_inherited_descriptions.py --categories deities fauna flora groups people places realia --check
          python3 -I scripts/audit_identity_surface.py
      - name: UBS source-baseline regressions
        run: |
          python3 -I links/dictionaries/ubs-greek/test_index.py
          python3 -I links/dictionaries/ubs-hebrew/test_index.py

# Full external source-pinned Greek/Hebrew checks run in their dedicated
# workflows; do not upload restricted evidence or publish releases here.
