name: Prepare pinned MACULA–LSG working corpus
on:
  push:
    branches:
      - alignment/macula-lsg-genesis-1
    paths:
      - '.github/workflows/prepare-macula-lsg-corpus.yml'
permissions:
  contents: write
concurrency:
  group: prepare-macula-lsg-working-corpus
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alignment/macula-lsg-genesis-1
      - name: Prepare source projections and commit directly to working branch
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import re
          import subprocess
          import time
          import urllib.request
          import xml.etree.ElementTree as ET
          from collections import defaultdict
          from pathlib import Path

          ROOT = Path("links/alignments/macula-lsg/sources")
          LSG_COMMIT = "11a869427991297addc27ed42728fa213e55e720"
          LSG_PATH = "sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml"
          LSG_BLOB = "b1ac2146fb7517e5e08a25f5ca321670f5dcefb5"
          H_COMMIT = "47db250bd55d0d8577f2a94fba114ef16c35b23c"
          H_REPO = "Clear-Bible/macula-hebrew"
          H_ATTRIBUTION = "MACULA Hebrew Linguistic Datasets, available at https://github.com/Clear-Bible/macula-hebrew/ © 2022–2024 Biblica, Inc., CC BY 4.0; Westminster Leningrad Codex text unrestricted; OpenScriptures Hebrew Bible and Groves Center morphology/syntax CC BY 4.0. See pinned LICENSE.md."

          def fetch(url):
              for attempt in range(5):
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent": "BRSI-source-preparation"})
                      with urllib.request.urlopen(request, timeout=120) as response:
                          return response.read()
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(2 ** attempt)

          def blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          def save(path, obj):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(obj, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")

          def commit(message):
              subprocess.run(["git", "add", str(ROOT)], check=True)
              if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode:
                  subprocess.run(["git", "-c", "user.name=BRSI source preparation", "-c", "user.email=41898282+github-actions[bot]@users.noreply.github.com", "commit", "-m", message], check=True)
                  subprocess.run(["git", "push", "origin", "HEAD:alignment/macula-lsg-genesis-1"], check=True)

          raw = fetch(f"https://raw.githubusercontent.com/icfmp/Bible-Resources/{LSG_COMMIT}/{LSG_PATH}")
          if blob(raw) != LSG_BLOB:
              raise ValueError("LSG source blob mismatch")
          raw_text = raw.decode("utf-8")
          chapters = defaultdict(dict)
          for m in re.finditer(r'<verse\b[^>]*\bsID="([^"]+)"[^>]*/>(.*?)<verse\b[^>]*\beID="\1"[^>]*/>', raw_text, re.S):
              ref, content = m.groups()
              parts = ref.split(".")
              if len(parts) != 3 or not parts[1].isdigit():
                  raise ValueError(f"Unsupported native OSIS reference: {ref}")
              book, chapter, verse = parts
              prose = re.sub(r"<note\b[^>]*>.*?</note>", "", content, flags=re.S)
              prose = re.sub(r"<[^>]+>", "", prose).strip()
              if verse in chapters[book, chapter]:
                  raise ValueError(f"Duplicate OSIS reference: {ref}")
              chapters[book, chapter][verse] = prose
          if not chapters:
              raise ValueError("No LSG milestones found")
          for (book, chapter), verses in chapters.items():
              save(ROOT / "lsg" / book / f"{int(chapter):03}.json", {
                  "book": book, "chapter": int(chapter), "verses": verses,
                  "reading_text_sha256": hashlib.sha256("\n".join(verses.values()).encode()).hexdigest()
              })
          lsg_manifest = {
              "repository": "icfmp/Bible-Resources", "tag": "lsg-1.0.4", "commit": LSG_COMMIT,
              "path": LSG_PATH, "git_blob": LSG_BLOB, "sha256": hashlib.sha256(raw).hexdigest(),
              "bytes": len(raw), "chapters": len(chapters), "verse_slots": sum(map(len, chapters.values())),
              "license": "Louis Segond 1910 reading text, public domain; Bible Resources / eBible.org.",
              "projection": "Native OSIS milestone content; remove notes and markup only, retain punctuation and interior whitespace, strip outer whitespace. No Strong annotations or note content. Original OSIS remains immutable upstream."
          }
          save(ROOT / "lsg" / "manifest.json", lsg_manifest)
          print("LSG:", lsg_manifest, flush=True)

          tree = json.loads(fetch(f"https://api.github.com/repos/{H_REPO}/git/trees/{H_COMMIT}?recursive=1"))
          entries = [entry for entry in tree["tree"] if re.fullmatch(r"WLC/lowfat/\d+-[A-Za-z0-9]+-\d+-lowfat\.xml", entry["path"])]
          if tree["truncated"] or len(entries) != 929:
              raise ValueError("Incomplete pinned WLC chapter inventory")
          XML_ID = "{http://www.w3.org/XML/1998/namespace}id"
          def hebrew(entry):
              path = entry["path"]
              data = fetch(f"https://raw.githubusercontent.com/{H_REPO}/{H_COMMIT}/{path}")
              if blob(data) != entry["sha"]:
                  raise ValueError(f"WLC blob mismatch: {path}")
              m = re.fullmatch(r"WLC/lowfat/(\d+)-([A-Za-z0-9]+)-(\d+)-lowfat\.xml", path)
              _, book, chapter = m.groups()
              words = []
              for word in ET.fromstring(data).iter("w"):
                  # Explicit field allowlist: no dictionaries, senses, glosses, or third-party annotations.
                  if not word.get(XML_ID) or not word.get("ref"):
                      raise ValueError(f"Missing ID or reference in {path}")
                  words.append([word.get(XML_ID), word.get("ref"), word.text or "", word.get("lemma"), word.get("pos"), word.get("morph"), word.get("lang")])
              if not words:
                  raise ValueError(f"No original words: {path}")
              save(ROOT / "macula-hebrew" / book / f"{int(chapter):03}.json", {
                  "source_path": path, "git_blob": entry["sha"], "words": words
              })
              return len(words)

          first = [e for e in entries if re.fullmatch(r"WLC/lowfat/01-Gen-0(0[1-9]|10)-lowfat\.xml", e["path"])]
          rest = [e for e in entries if e not in first]
          if len(first) != 10:
              raise ValueError("Genesis starter inventory mismatch")
          def batch(items):
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as executor:
                  return sum(executor.map(hebrew, items))
          first_words = batch(first)
          h_manifest = {
              "repository": H_REPO, "commit": H_COMMIT,
              "attribution": H_ATTRIBUTION, "license_url": f"https://github.com/{H_REPO}/blob/{H_COMMIT}/LICENSE.md",
              "tuple": ["xml:id", "ref", "surface", "lemma", "pos", "morph", "lang"],
              "source_chapter_count": 929, "materialized_chapters": 10,
              "materialized_morphs": first_words,
              "exclusions": "All glosses, Strong associations, semantic domains, contextual senses, participant references, frames, English alignment and other unreviewed fields."
          }
          save(ROOT / "macula-hebrew" / "manifest.json", h_manifest)
          (ROOT / "README.md").write_text(
              "# Pinned working corpus\n\nDevelopment-only chapter projections, not a release or an edition of Scripture. "
              "The exact source bytes remain upstream; manifests identify their revisions and Git blobs. "
              "Read the JSON chapter files directly for editorial alignment. Do not edit this corpus to resolve alignment issues. "
              "LSG is the reading-text projection of the published 1.0.4 OSIS; MACULA Hebrew includes only the allowed text, occurrence identity and morphology fields. "
              "No dictionary prose or permission-only semantic annotations are included. "
              "Greek materialization remains separate until the underlying SBLGNT text license is confirmed. "
              "Publication checks and approval remain separate under #62.\n", encoding="utf-8")
          commit("Materialize pinned LSG and Genesis 1–10 working sources")
          print("First ten Hebrew chapters committed:", first_words, flush=True)

          total_words = first_words + batch(rest)
          h_manifest.update(materialized_chapters=len(entries), materialized_morphs=total_words)
          save(ROOT / "macula-hebrew" / "manifest.json", h_manifest)
          commit("Materialize remaining pinned MACULA Hebrew working chapters")
          print("Hebrew:", h_manifest, flush=True)
          PY
