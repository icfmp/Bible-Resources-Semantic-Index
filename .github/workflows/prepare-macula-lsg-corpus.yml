name: Prepare pinned MACULA Greek working corpus
on:
  push:
    branches:
      - alignment/macula-lsg-genesis-1
    paths:
      - '.github/workflows/prepare-macula-lsg-corpus.yml'
permissions:
  contents: write
concurrency:
  group: prepare-macula-lsg-working-corpus
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alignment/macula-lsg-genesis-1
      - name: Materialize the pinned Greek working corpus
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import re
          import subprocess
          import time
          import urllib.request
          import xml.etree.ElementTree as ET
          from collections import defaultdict
          from pathlib import Path

          ROOT = Path("links/alignments/macula-lsg/sources")
          OUT = ROOT / "macula-greek"
          REPO = "Clear-Bible/macula-greek"
          COMMIT = "8423afe47b9e8f24b7772e808af45c7159a6fe7e"
          SBL_COMMIT = "736fdc76158950c3d04b949b7e013ca05145a"
          XML_ID = "{http://www.w3.org/XML/1998/namespace}id"

          def fetch(url):
              for attempt in range(5):
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent": "BRSI-source-preparation"})
                      with urllib.request.urlopen(request, timeout=120) as response:
                          return response.read()
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(2 ** attempt)

          def blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          def save(path, obj):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(obj, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")

          tree = json.loads(fetch(f"https://api.github.com/repos/{REPO}/git/trees/{COMMIT}?recursive=1"))
          entries = [e for e in tree["tree"] if re.fullmatch(r"SBLGNT/lowfat/\d+-[^/]+\.xml", e["path"])]
          if tree["truncated"] or len(entries) != 27:
              raise ValueError("Incomplete Greek book inventory")

          def book(entry):
              path = entry["path"]
              data = fetch(f"https://raw.githubusercontent.com/{REPO}/{COMMIT}/{path}")
              if blob(data) != entry["sha"]:
                  raise ValueError(f"Greek blob mismatch: {path}")
              root = ET.fromstring(data)
              chapters = defaultdict(list)
              for word in root.iter("w"):
                  ref = word.get("ref", "")
                  match = re.fullmatch(r"(\S+) (\d+):(\d+[a-z]?)!(\d+)", ref)
                  if not match or not word.get(XML_ID):
                      raise ValueError(f"Unsupported source word identity: {path}: {ref}")
                  b, chapter, verse, ordinal = match.groups()
                  # Explicit field allowlist, no permission-only LN/domain, gloss, sense or other data.
                  chapters[b, int(chapter)].append([word.get(XML_ID), ref, word.text or "", word.get("lemma"), word.get("class"), word.get("morph"), word.get("after")])
              for (b, chapter), words in chapters.items():
                  save(OUT / b / f"{chapter:03}.json", {
                      "source_path": path, "git_blob": entry["sha"], "words": words
                  })
              return len(chapters), sum(map(len, chapters.values()))

          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as executor:
              results = list(executor.map(book, entries))
          manifest = {
              "repository": REPO, "commit": COMMIT, "edition": "SBLGNT",
              "underlying_text": {"repository": "Faithlife/SBLGNT", "commit": SBL_COMMIT,
                  "attribution": "SBL Greek New Testament © 2010 Society of Biblical Literature and Logos Bible Software, CC BY 4.0",
                  "license_witness": f"https://github.com/Faithlife/SBLGNT/blob/{SBL_COMMIT}/README.md"},
              "attribution": "MACULA Greek Linguistic Datasets, available at https://github.com/Clear-Bible/macula-greek/ © 2022–2024 Biblica, Inc., CC BY 4.0",
              "license_url": f"https://github.com/{REPO}/blob/{COMMIT}/LICENSE.md",
              "tuple": ["xml:id", "ref", "surface", "lemma", "class", "morph", "after"],
              "books": len(entries), "chapters": sum(a for a, _ in results), "words": sum(b for _, b in results),
              "projection": "Preserve native references and source tree traversal order; use the original reference ordinal for reading order. No text editing. Exclude Strong, glosses, LN, domains, senses and all other fields.",
              "license": "CC BY 4.0; see both pinned notices. Development-only working projection, not a release."
          }
          save(OUT / "manifest.json", manifest)
          readme = ROOT / "README.md"
          readme.write_text(readme.read_text(encoding="utf-8").replace(
              "Greek materialization remains separate until the underlying SBLGNT text license is confirmed.",
              "MACULA Greek is similarly projected from the pinned SBLGNT source. Both the MACULA Greek data and the underlying SBLGNT text have verified CC BY 4.0 notices; permission-only LN/domain fields are excluded."), encoding="utf-8")
          subprocess.run(["git", "add", str(ROOT)], check=True)
          subprocess.run(["git", "-c", "user.name=BRSI source preparation", "-c", "user.email=41898282+github-actions[bot]@users.noreply.github.com", "commit", "-m", "Materialize complete pinned MACULA Greek working corpus"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:alignment/macula-lsg-genesis-1"], check=True)
          print(manifest, flush=True)
          PY
