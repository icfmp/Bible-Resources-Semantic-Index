name: Verify native BSI entities against historical build

on:
  push:
    branches: [migration/materialize-entities]
    paths:
      - "scripts/validate_native_entities.py"
      - "scripts/build_native_index.py"
      - "scripts/compile_index.py"
      - "data/entities/**"
      - "data/quarantined/**"
      - ".github/workflows/verify-native-entities.yml"
  pull_request:
    paths:
      - "scripts/validate_native_entities.py"
      - "scripts/build_native_index.py"
      - "scripts/compile_index.py"
      - "data/entities/**"
      - "data/quarantined/**"
      - ".github/workflows/verify-native-entities.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the exact original ACAI witness
        run: |
          git clone --quiet https://github.com/icfmp/ACAI.git /tmp/acai-verify
          git -C /tmp/acai-verify checkout --quiet e80a874e8282f996199c595378a3b3b9a43aac22
          test "$(git -C /tmp/acai-verify rev-parse HEAD)" = "e80a874e8282f996199c595378a3b3b9a43aac22"
          test -z "$(git -C /tmp/acai-verify status --porcelain)"
      - name: Verify each record, rationale, source checksum and original word link
        run: |
          python3 -I scripts/validate_native_entities.py --source /tmp/acai-verify --native data
      - name: Build entirely from native version-controlled entities
        run: |
          python3 -I scripts/build_native_index.py --data data --output /tmp/bsi-from-native.json
      - name: Verify byte-identical public BSI index against old source-plus-overlays
        run: |
          python3 -I scripts/compile_index.py --source /tmp/acai-verify --output /tmp/bsi-legacy.json
          python3 -I scripts/distribution_profile.py --input /tmp/bsi-legacy.json --output /tmp/bsi-public-legacy.json
          cmp /tmp/bsi-public-legacy.json /tmp/bsi-from-native.json
          sha256sum /tmp/bsi-public-legacy.json /tmp/bsi-from-native.json
