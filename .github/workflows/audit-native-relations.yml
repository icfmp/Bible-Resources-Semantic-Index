name: Audit native BSI relationships

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_entity_relationships.py"
      - "tests/test_entity_relationships.py"
      - "data/entities/**"
      - "data/quarantined/**"
      - ".github/workflows/audit-native-relations.yml"
  pull_request:
    paths:
      - "scripts/audit_entity_relationships.py"
      - "tests/test_entity_relationships.py"
      - "data/entities/**"
      - "data/quarantined/**"
      - ".github/workflows/audit-native-relations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Audit current structured relationships without modifying any data
        run: |
          python3 -I tests/test_entity_relationships.py
          python3 -I scripts/audit_entity_relationships.py --report /tmp/bsi-native-relationships.json --fail-on-unresolved
      - name: Preserve complete audited relationship findings
        uses: actions/upload-artifact@v4
        with:
          name: bsi-native-relationship-audit
          path: /tmp/bsi-native-relationships.json
          retention-days: 14
