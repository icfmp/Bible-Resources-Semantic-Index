name: One-time ACAI to native BSI conversion (review branch only)

on:
  push:
    branches: [migration/materialize-entities]
    paths:
      - "scripts/materialize_entities.py"
      - "tests/test_materialize_entities.py"
      - ".github/workflows/materialize-entities.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify migration regressions
        run: python3 -I tests/test_materialize_entities.py
      - name: Check out exactly the frozen ACAI source
        run: |
          git clone --quiet https://github.com/icfmp/ACAI.git /tmp/acai-migration-source
          git -C /tmp/acai-migration-source checkout --quiet e80a874e8282f996199c595378a3b3b9a43aac22
          test "$(git -C /tmp/acai-migration-source rev-parse HEAD)" = "e80a874e8282f996199c595378a3b3b9a43aac22"
          test -z "$(git -C /tmp/acai-migration-source status --porcelain)"
      - name: Materialize reviewed records (restricted keyterms excluded pending review)
        run: |
          python3 -I scripts/materialize_entities.py \
            --source /tmp/acai-migration-source \
            --output /tmp/bsi-native-migration
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/bsi-native-migration")
          manifest=json.loads((root/"migration-manifest.json").read_text())
          assert manifest["source_records"] == 6644
          assert manifest["restricted_unpublished_keyterms"] == 868
          assert manifest["written_records"] == 5776
          assert len(list((root/"entities").rglob("*.json"))) + len(list((root/"quarantined").rglob("*.json"))) == 5776
          print("Verified", manifest["written_records"], "persistable reviewed-source records")
          PY
      - name: Commit safely materialized records to this review branch
        run: |
          test "$GITHUB_REF" = "refs/heads/migration/materialize-entities"
          test ! -e data/entities
          test ! -e data/quarantined
          mkdir -p data
          mv /tmp/bsi-native-migration/entities data/entities
          if test -d /tmp/bsi-native-migration/quarantined; then
            mv /tmp/bsi-native-migration/quarantined data/quarantined
          fi
          mkdir -p data/migration
          mv /tmp/bsi-native-migration/migration-manifest.json data/migration/acai-baseline-materialization.json
          if find data/entities -path '*/keyterms/*' -print -quit | grep -q .; then
            echo 'Restricted keyterms unexpectedly found in public tree' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entities data/quarantined data/migration/acai-baseline-materialization.json
          git commit -m "Materialize reviewed ACAI records as current BSI data (keyterms pending rights)"
          git push origin HEAD:refs/heads/migration/materialize-entities
