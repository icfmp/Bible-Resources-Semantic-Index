name: Verify BRSI entity word IDs against pinned Macula originals

on:
  pull_request:
    paths:
      - "data/entities/**"
      - "data/source.lock.json"
      - "data/source-key-resolved-115.json"
      - "data/source-key-next-115-candidates.json"
      - "data/source-key-unresolved-queue.json"
      - "data/source-key-next-115-resolved.json"
      - "data/source-key-final-128-candidates.json"
      - "scripts/validate_source_key_resolution_batches.py"
      - "tests/test_source_key_resolution_batches.py"
      - "scripts/inspect_next_source_key_cases.py"
      - "scripts/validate_resolved_source_keys.py"
      - "tests/test_resolved_source_keys.py"
      - "data/source-key-identity-review-115.json"
      - "scripts/validate_source_key_identity_reviews.py"
      - "tests/test_source_key_identity_review_115.py"
      - "data/source-unattested-words.json"
      - "scripts/verify_pinned_entity_words.py"
      - "tests/test_verify_pinned_entity_words.py"
      - "scripts/audit_place_source_word_candidates.py"
      - "scripts/inspect_pinned_original_verse.py"
      - "scripts/audit_all_key_reference_original_words.py"
      - "tests/test_audit_all_key_reference_original_words.py"
      - "tests/test_audit_place_source_word_candidates.py"
      - ".github/workflows/verify-entity-original-words.yml"
  push:
    branches: [main]
    paths:
      - "data/entities/**"
      - "data/source.lock.json"
      - "data/source-key-resolved-115.json"
      - "data/source-key-next-115-candidates.json"
      - "data/source-key-unresolved-queue.json"
      - "data/source-key-next-115-resolved.json"
      - "scripts/validate_source_key_resolution_batches.py"
      - "tests/test_source_key_resolution_batches.py"
      - "scripts/inspect_next_source_key_cases.py"
      - "scripts/validate_resolved_source_keys.py"
      - "tests/test_resolved_source_keys.py"
      - "data/source-key-identity-review-115.json"
      - "scripts/validate_source_key_identity_reviews.py"
      - "tests/test_source_key_identity_review_115.py"
      - "data/source-unattested-words.json"
      - "scripts/verify_pinned_entity_words.py"
      - "tests/test_verify_pinned_entity_words.py"
      - ".github/workflows/verify-entity-original-words.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-word-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test source identity and strict word-inventory validator
        run: python3 -I tests/test_verify_pinned_entity_words.py
      - name: Pin exact Macula Hebrew WLC source inventory
        uses: actions/checkout@v4
        with:
          repository: Clear-Bible/macula-hebrew
          ref: 47db250bd55d0d8577f2a94fba114ef16c35b23c
          path: macula-hebrew
          sparse-checkout: WLC/tsv
          lfs: true
          persist-credentials: false
      - name: Pin exact Macula Greek SBLGNT source inventory
        uses: actions/checkout@v4
        with:
          repository: Clear-Bible/macula-greek
          ref: 8423afe47b9e8f24b7772e808af45c7159a6fe7e
          path: macula-greek
          sparse-checkout: SBLGNT/tsv
          lfs: true
          persist-credentials: false
      - name: Compare checked-out commits to locked input editions
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          source=json.loads(Path("data/source.lock.json").read_text())
          for corpus, directory, repo in (
              ("wlc","macula-hebrew","Clear-Bible/macula-hebrew"),
              ("sblgnt","macula-greek","Clear-Bible/macula-greek"),
          ):
              actual=subprocess.check_output(
                  ["git", "-C", directory, "rev-parse", "HEAD"], text=True).strip()
              assert source["source_editions"][corpus]["edition"] == f"{repo}@{actual}"
          PY
      - name: Triangulate missing source-word identity witnesses without auto-mapping
        run: |
          python3 -I tests/test_audit_place_source_word_candidates.py
          python3 -I scripts/audit_place_source_word_candidates.py \
            --data data \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --max-cases 150
          # Candidate source-word hints are for editorial review only.
      - name: Review exact original words for outstanding source-identity examples
        run: |
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 43004006 43004005 01014001 19083008 13002049 27011005 48001017 26038006 04014025 43004025
          # Independent complete original-word witnesses for unanchored geographic phrases.
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 07009037 07009046 07009047 07009049 12018017 23007003 23036002 29004014 01026017 06016001 09023024 09023025 01021021 04013026 09025001 04014025 05001040 06015019 07001015 01022014 11006005 11008010 04022036 23015005 24048034 40015039 05032014 11009026 02010019 04033010 04033011 27011005 27011011
          # Full original word inventory to adjudicate the next 31 ambiguous source keys.
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 26011017 26020038 26020042 26037012 40002019 07003008 01024010 05023004 44007030 15010043 60005013 66017005 30009003 23056007 36003009 03014004 04019006 12001002 12001016 40003007 03011031 09024003 21012004 40006026 09015032 09015033 27001006 27001019 23044014 17008008 13009007
          # Additional source-collation of 25 unresolved place/structure verses.
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 40004025 40019001 41010001 43001028 06018015 13004012 13026014 13026015 24048001 09022006 26038006 18026007 19048003 23014013 11006005 11008010 01024010 04022036 23015005 24048034 09030030 10013034 09030005 16003007 13027030
          # Third case-oriented source audit; these rows are evidence, not automatic links.
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 58011032 02001009 02019003 01036035 01010015 01010019 02006018 04004041 04007009 01046011 06009003 04021009 03005002 05032024 02028042 10005023 18031004 23044014 40026003 41014003 01006014 01007001 01008004 01028009 16013004 16013007 13009007 15004007 50002005 50002010 28009010 27005028 06015009 06018015 05023003 24029024 10021018 13012004 23035002
      - name: Full key-only reference investigation against pinned WLC and SBLGNT
        run: |
          python3 -I tests/test_audit_all_key_reference_original_words.py
          python3 -I scripts/audit_all_key_reference_original_words.py \
            --data data \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --report /tmp/brsi-key-reference-source-review.json \
            --max-lines 450
          # Read-only candidates must not be promoted into native data.
      - name: Check every active exact original-word claim against pinned source
        run: |
          python3 -I scripts/verify_pinned_entity_words.py             --data data             --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv             --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv
          # Read-only source verification. No copy/publish of source inventories.

      - name: Inspect remaining source ambiguities for 115-case milestone
        run: |
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 01011002 01011031 15001011 15002001 24051024 38005011 23015005 24048034 13012004 13012005 26038006 10021018 04022036 24046009 26030005 13027030 16003007 24048001 18002011 18042009 24029024 24029031 24029032 13026014 09022006 10023032 13011033 27011005
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 27011011 13026015 18026007 19048003 23014013 01017004 44009002 44009003 44009005 07009002 40010002 06007021 06007025 01030006 01029034 01029033 01010022 01010015 06018028

      - name: Validate reviewed key identities against exact pinned originals
        run: |
          python3 -I scripts/validate_source_key_identity_reviews.py \
            --data data \
            --review data/source-key-identity-review-115.json \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv

      - name: Inspect additional eleven role and ethnic-source cases
        run: |
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 12001002 12001016 13012018 01014019 01014020 01003001 03011031 02028042 10005023 13001013 23021013 48001017 07003008 06009018

      - name: Audit complete remaining source-reference queue for resolution, read-only
        run: |
          python3 -I scripts/audit_source_reference_evidence.py --data data --details

      - name: Collate 38 remaining object and ethnonym verses against pinned originals
        run: |
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 04026058 01014005 01014015 01010013 01010014 41012041 41012042 40022020 41012016 66012005 66012009 10012031 09016011 66003014 66003015 06006020 16002017 12004002 02026001 46009025 01024053 02035022 04031050 09013020 66001018 09025018 01028018 01031045 02003005 05023025 26001019 05022012 09005002 40023027 02028042 10005023 03011031 09016013

      - name: Verify thirteen genuine tribal territorial allocations in Joshua WLC
        run: |
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 06019024 06018011 06019040 06013029 06016005 06013024 06019017 06015001 06019032 06013015 06019001 06017001 06019010

      - name: Adjudicate siege, covering and biblical coin cases in pinned originals
        run: |
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 27011015 26004002 33004014 10020015 01003007 23029003 09010001 04027058 04026058 40017024

      - name: Inspect beam restoration terminology in 2 Chronicles 34:11
        run: |
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 14034011

      - name: Collate further tangible and ethnographic source keys for evidence-backed closure
        run: |
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 66004005 66008010 18039003 18039009 05006008 05011018 40027026 08003002 15002021 01010006 09001001 13012032 13001032 01010022

      - name: Verify exact original words for eleven new correct/contextual decisions
        run: |
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 01002013 11009020 11009021 06009003 06009004 16004002 42009052 42009053 05006008 05011018 01010022 18039003 18039009

      - name: Corroborate immediate narrative referents before declaring correct contextual keys
        run: |
          python3 -I scripts/inspect_pinned_original_verse.py \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --verses 06009017 10005009 03011030 06024011 11009019 01010014 05023025 13001014

      - name: Certify 115 resolved source identities against both exact pinned corpora
        run: |
          python3 -I scripts/validate_resolved_source_keys.py \
            --data data \
            --ledger data/source-key-resolved-115.json \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv

      - name: Certify second 115 genuinely resolved source keys against exact Hebrew and Greek pins
        run: |
          python3 -I tests/test_source_key_resolution_batches.py
          python3 -I scripts/validate_source_key_resolution_batches.py \
            --data data \
            --ledger data/source-key-next-115-resolved.json \
            --selection data/source-key-next-115-candidates.json \
            --previous data/source-key-resolved-115.json \
            --pool data/source-key-unresolved-queue.json \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv

      - name: Inspect final 128 distinct source-key identities without automatic adjudication
        run: |
          python3 -I scripts/inspect_next_source_key_cases.py \
            --data data \
            --candidates data/source-key-final-128-candidates.json \
            --wlc macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --sblgnt macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --compact
          # No records are changed by this read-only dossier.
