name: One-time BRSI redundant locale label removal (places)

on:
  push:
    branches:
      - phase0/prune-nonworking-labels-places
    paths:
      - .github/workflows/one-time-description-batch.yml

permissions:
  contents: write

jobs:
  verified-prose-prune:
    if: github.repository == 'icfmp/Bible-Resources-Semantic-Index'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and write only selected description fields
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "phase0/prune-nonworking-labels-places"
          python3 -I scripts/build_native_index.py --data data --output /tmp/brsi-before.json
          python3 -I scripts/prune_nonworking_labels.py --categories places
          python3 -I scripts/prune_nonworking_labels.py --categories places --write
          python3 -I scripts/prune_nonworking_labels.py --categories places --check
          python3 -I scripts/build_native_index.py --data data --output /tmp/brsi-after.json
          cmp /tmp/brsi-before.json /tmp/brsi-after.json
          sha256sum /tmp/brsi-before.json /tmp/brsi-after.json
          python3 -I -m unittest discover -s tests -p 'test_*.py'
          python3 -I links/dictionaries/ubs-greek/test_index.py
          python3 -I links/dictionaries/ubs-hebrew/test_index.py
      - name: Commit only verified data changes on the temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entities/places
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          assert paths, "Expected description cleanup changes"
          prefixes = ("data/entities/places/",)
          assert all(path.startswith(prefixes) and path.endswith(".json") for path in paths)
          print("Reviewed data files staged:", len(paths))
          PY
          git commit -m "data: remove redundant translated display names from places"
          git push origin HEAD:refs/heads/phase0/prune-nonworking-labels-places
