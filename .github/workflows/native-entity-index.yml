name: BSI native entity build (no ACAI checkout)

on:
  push:
    branches: [main]
    paths:
      - "data/entities/**"
      - "data/quarantined/**"
      - "data/migration/**"
      - "scripts/build_native_index.py"
      - "scripts/entity_index_core.py"
      - "tests/test_native_growth.py"
      - "tests/support/legacy_acai_compiler.py"
      - "scripts/release_contract.py"
      - "scripts/stage_entity_candidate.py"
      - "release/**"
      - "docs/RELEASE_CONTRACT.md"
      - "docs/EDITING_ENTITIES.md"
      - ".github/workflows/native-entity-index.yml"
  pull_request:
    paths:
      - "data/entities/**"
      - "data/quarantined/**"
      - "data/migration/**"
      - "scripts/build_native_index.py"
      - "scripts/entity_index_core.py"
      - "tests/support/legacy_acai_compiler.py"
      - "scripts/release_contract.py"
      - "release/**"
      - "docs/RELEASE_CONTRACT.md"
      - ".github/workflows/native-entity-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-current-native-index:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify native data can grow without dropping historical identities
        run: python3 -I tests/test_native_growth.py
      - name: Build index from current versioned BSI entity records
        run: |
          python3 -I scripts/build_native_index.py --data data --output /tmp/bsi-current.json
      - name: Record local build file-byte integrity (not publication approval)
        run: |
          python3 -I scripts/write_integrity_receipt.py \
            --entity /tmp/bsi-current.json \
            --greek links/dictionaries/ubs-greek/index.json \
            --hebrew links/dictionaries/ubs-hebrew/index.json \
            --output /tmp/bsi-integrity-receipt.json
          cat /tmp/bsi-integrity-receipt.json
      - name: Stage three local v1 integrity receipts (never distribute lexical baselines)
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          python3 -I scripts/release_contract.py local-receipt \
            --kind entities --input /tmp/bsi-current.json \
            --producer-revision "$revision" \
            --output /tmp/brsi-entities-local.json
          python3 -I scripts/release_contract.py local-receipt \
            --kind ubs_greek --input links/dictionaries/ubs-greek/index.json \
            --producer-revision "$revision" \
            --output /tmp/brsi-greek-local.json
          python3 -I scripts/release_contract.py local-receipt \
            --kind ubs_hebrew --input links/dictionaries/ubs-hebrew/index.json \
            --producer-revision "$revision" \
            --output /tmp/brsi-hebrew-local.json
          python3 -I scripts/release_contract.py verify \
            --manifest /tmp/brsi-entities-local.json --artifact /tmp/bsi-current.json
          python3 -I scripts/release_contract.py verify \
            --manifest /tmp/brsi-greek-local.json --artifact links/dictionaries/ubs-greek/index.json
          python3 -I scripts/release_contract.py verify \
            --manifest /tmp/brsi-hebrew-local.json --artifact links/dictionaries/ubs-hebrew/index.json
          # No upload, tag, release, public archive, or source witness snapshot.
      - name: Stage and reverify deterministic unapproved entity ZIP locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/stage_entity_candidate.py stage \
            --index /tmp/bsi-current.json \
            --lock data/source.lock.json \
            --producer-revision "$(git rev-parse HEAD)" \
            --output /tmp/brsi-entities-unapproved.zip \
            --receipt /tmp/brsi-entities-unapproved.json
          python3 -I scripts/stage_entity_candidate.py verify \
            --archive /tmp/brsi-entities-unapproved.zip \
            --receipt /tmp/brsi-entities-unapproved.json
          # Independently stage a second time from the exact same current
          # native build and immutable commit. The ZIP and its sidecar must
          # have identical bytes, not just equivalent semantic JSON.
          python3 -I scripts/stage_entity_candidate.py stage \
            --index /tmp/bsi-current.json \
            --lock data/source.lock.json \
            --producer-revision "$(git rev-parse HEAD)" \
            --output /tmp/brsi-entities-second.zip \
            --receipt /tmp/brsi-entities-second.json
          cmp /tmp/brsi-entities-unapproved.zip /tmp/brsi-entities-second.zip
          cmp /tmp/brsi-entities-unapproved.json /tmp/brsi-entities-second.json
          # No upload-artifact step; candidate bytes never leave this job.
      - name: Verify output scope and original-word integrity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path("data/migration/acai-baseline-materialization.json").read_text())
          built=json.loads(Path("/tmp/bsi-current.json").read_text())
          assert built["schema_version"] == 1
          assert built["statistics"]["source_records"] == source["source_records"]
          assert built["statistics"]["index_entities"] + built["statistics"]["quarantined_records"] >= source["written_records"]
          assert built["provenance"]["source_snapshot_sha256"] == source["source_snapshot_sha256"]
          assert built["distribution_profile"]["excluded_entity_count"] == source["restricted_unpublished_keyterms"]
          assert all(not e["id"].startswith("keyterm:") for e in built["entities"])
          for key, claims in built["by_word"].items():
              assert ":" in key
              assert claims
              assert len(claims) == len({(r["entity_id"],r["link_type"]) for r in claims})
          print("Current native records built and cross-indexed:", built["statistics"])
          PY
